<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line planning board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD0}a:hover{color:#43299F}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 1000px; background: #F6F5FB; color: #1B1830; font-family: Inter, system-ui, sans-serif">

  <header style="padding: 24px clamp(16px, 2vw, 28px); background: #fff; border-bottom: 1px solid #E3E0EE; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; gap: 14px; align-items: center">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #EEE9FD; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B3FD0" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></div>
        <div>
          <div style="font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .16em; color: #5B3FD0">LIVE PLAN</div>
          <h1 style="margin: 2px 0 0; font-size: 24px; font-weight: 700">Line Planning Board</h1>
          <div style="font-size: 13px; color: #5B5670">Drag a bar to another day or another line.</div>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <div role="group" aria-label="Plan" style="display: inline-flex; background: #F6F5FB; border: 1px solid #E3E0EE; border-radius: 10px; padding: 3px">
          <button style="font: 600 13px Inter, sans-serif; border: 0; background: #5B3FD0; color: #fff; padding: 9px 14px; border-radius: 8px">Live plan</button>
          <button style="font: 500 13px Inter, sans-serif; border: 0; background: transparent; color: #4D4868; padding: 9px 14px; border-radius: 8px">What-if</button>
        </div>
        <button style="font: 600 13px Inter, sans-serif; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #D6D2E4; background: #fff; color: #1B1830">+ Schedule an order</button>
        <button aria-label="Previous week" style="height: 44px; width: 44px; border-radius: 10px; border: 1px solid #D6D2E4; background: #fff; font-size: 16px; color: #4D4868">‹</button>
        <button style="font: 600 13px Inter, sans-serif; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #D6D2E4; background: #fff; color: #1B1830">Today</button>
        <button aria-label="Next week" style="height: 44px; width: 44px; border-radius: 10px; border: 1px solid #D6D2E4; background: #fff; font-size: 16px; color: #4D4868">›</button>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; justify-content: space-between">
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <div style="background: #fff; border: 1px solid #E3E0EE; border-radius: 12px; padding: 10px 16px; min-width: 130px"><div style="font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #5B5670">SLOTS ON BOARD</div><div style="font: 500 24px 'JetBrains Mono', monospace">11</div></div>
        <div style="background: #FFF6F8; border: 1px solid #F3C3D0; border-radius: 12px; padding: 10px 16px; min-width: 130px"><div style="font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #5B5670">LATE VS EX-FACTORY</div><div style="font: 500 24px 'JetBrains Mono', monospace; color: #BE1E48">1</div></div>
        <div style="background: #FFFAF1; border: 1px solid #F4D9A8; border-radius: 12px; padding: 10px 16px; min-width: 130px"><div style="font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #5B5670">TIGHT</div><div style="font: 500 24px 'JetBrains Mono', monospace; color: #A35200">2</div></div>
        <div style="background: #fff; border: 1px solid #E3E0EE; border-radius: 12px; padding: 10px 16px; min-width: 130px"><div style="font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #5B5670">NOT PLANNED</div><div style="font: 500 24px 'JetBrains Mono', monospace">3</div></div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: #4D4868">
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: #E2F4EB; border: 1.5px solid #22B07D; vertical-align: -2px"></span> On time</span>
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: #FDF1DC; border: 1.5px solid #F2A93B; vertical-align: -2px"></span> Tight</span>
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: #FCE7ED; border: 1.5px solid #EC5B7E; vertical-align: -2px"></span> Late</span>
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: #fff; border: 1.5px dashed #A35200; vertical-align: -2px"></span> Clash</span>
      </div>
    </div>
  </header>

  <div style="padding: 20px clamp(16px, 2vw, 28px) 28px">
    <div style="background: #fff; border: 1px solid #E3E0EE; border-radius: 16px; overflow-x: auto">
      <div style="min-width: 1180px">
        <div style="display: grid; grid-template-columns: 200px repeat(21, minmax(0, 1fr)); border-bottom: 1px solid #E3E0EE; font: 500 11px 'JetBrains Mono', monospace; color: #5B5670">
          <div style="padding: 12px 16px; font-weight: 600; letter-spacing: .1em; align-self: end">LINE</div>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="21">
            <div style="padding: 8px 0; text-align: center; border-left: {{d.edge}}; background: {{d.bg}}; color: {{d.fg}}"><div style="height: 14px; font-weight: 600; color: #1B1830; text-align: left; padding-left: 6px; white-space: nowrap">{{d.week}}</div>{{d.dow}}<br><b style="font-size: 12px">{{d.n}}</b></div>
          </sc-for>
        </div>
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 200px repeat(21, minmax(0, 1fr)); grid-auto-rows: minmax(40px, auto); row-gap: 6px; padding: 10px 0; border-bottom: 1px solid #EFEDF5; align-items: center">
            <div style="grid-column: 1; grid-row: 1 / span 2; padding: 0 16px"><div style="font-weight: 600; font-size: 14px">{{l.name}}</div><div style="font: 12px 'JetBrains Mono', monospace; color: #5B5670">{{l.meta}}</div></div>
            <sc-for list="{{l.bars}}" as="b" hint-placeholder-count="1">
              <div style="grid-column: {{b.col}}; grid-row: {{b.row}}; margin: 0 3px; height: 36px; box-sizing: border-box; border-radius: 8px; background: {{b.bg}}; border: 1.5px {{b.style}} {{b.bd}}; display: flex; align-items: center; gap: 8px; padding: 0 10px; overflow: hidden; white-space: nowrap; font: 500 12px 'JetBrains Mono', monospace; color: {{b.ink}}"><b>{{b.go}}</b><span style="color: #4D4868">{{b.st}}</span><span>{{b.qty}}</span></div>
            </sc-for>
            <div style="grid-column: 2 / span 21; grid-row: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0">
              <sc-for list="{{l.load}}" as="w" hint-placeholder-count="3">
                <div style="padding: 4px 10px; border-left: 1px solid #EFEDF5">
                  <div style="height: 5px; border-radius: 999px; background: #EFEDF5"><div style="height: 100%; width: {{w.w}}; border-radius: 999px; background: {{w.c}}"></div></div>
                  <div style="display: flex; justify-content: space-between; font: 500 11px 'JetBrains Mono', monospace; color: #5B5670; margin-top: 4px"><span>{{w.txt}}</span><b style="color: {{w.ink}}">{{w.pct}}</b></div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dows = ['M','T','W','T','F','S','S'];
    const days = [];
    for (let i = 0; i < 21; i++) {
      const n = 16 + i;
      const date = n > 30 ? n - 30 : n;
      const today = i === 1;
      days.push({
        dow: dows[i % 7], n: date,
        week: i % 7 === 0 ? (i === 0 ? '16 NOV' : i === 7 ? '23 NOV' : '30 NOV') : '',
        edge: i % 7 === 0 ? '1px solid #E3E0EE' : '0',
        bg: today ? '#EEE9FD' : (i % 7 >= 5 ? '#FAF9FD' : 'transparent'),
        fg: today ? '#5B3FD0' : '#5B5670'
      });
    }
    const T = {
      ok:   { bg: '#E2F4EB', bd: '#22B07D', ink: '#0B7A53', style: 'solid' },
      warn: { bg: '#FDF1DC', bd: '#F2A93B', ink: '#A35200', style: 'solid' },
      late: { bg: '#FCE7ED', bd: '#EC5B7E', ink: '#BE1E48', style: 'solid' },
      clash:{ bg: '#FFFFFF', bd: '#A35200', ink: '#A35200', style: 'dashed' }
    };
    const bar = (start, span, row, go, st, qty, t) => ({ col: (start + 2) + ' / span ' + span, row: String(row), go, st, qty, ...T[t] });
    const load = (arr) => arr.map(([a, b]) => {
      const r = a / b;
      const c = r > 1 ? '#EC5B7E' : r >= 0.9 ? '#F2A93B' : '#22B07D';
      const ink = r > 1 ? '#BE1E48' : r >= 0.9 ? '#A35200' : '#0B7A53';
      return { w: Math.min(100, Math.round(r * 100)) + '%', c, ink, pct: Math.round(r * 100) + '%', txt: a.toLocaleString('en-US') + ' / ' + b.toLocaleString('en-US') };
    });
    const lines = [
      { name: 'Line 1 · Knit Tops', meta: 'L01 · 18 ops · 64%', bars: [bar(0, 6, 1, 'GO/2026/0029', 'ST-0138', '3,200', 'ok'), bar(7, 8, 1, 'GO/2026/0034', 'ST-0150', '4,100', 'ok')], load: load([[14200, 24192], [16900, 24192], [9800, 24192]]) },
      { name: 'Line 2 · Knit Tops', meta: 'L02 · 12 ops · 58%', bars: [bar(0, 4, 1, 'GO/2026/0030', 'ST-0139', '1,800', 'ok'), bar(5, 6, 1, 'GO/2026/0036', 'ST-0151', '2,600', 'warn'), bar(8, 5, 2, 'GO/2026/0038', 'ST-0155', '1,400', 'clash')], load: load([[11600, 16128], [15800, 16128], [4200, 16128]]) },
      { name: 'Line 3 · Shirts', meta: 'L03 · 14 ops · 55%', bars: [bar(0, 12, 1, 'GO/2026/0027', 'ST-0131', '3,900', 'warn')], load: load([[17200, 18816], [12600, 18816], [0, 18816]]) },
      { name: 'Line 4 · Bottoms', meta: 'L04 · 15 ops · 60%', bars: [bar(0, 5, 1, 'GO/2026/0031', 'ST-0142', '1,190 left', 'late'), bar(6, 9, 1, 'GO/2026/0035', 'ST-0147', '3,300', 'ok')], load: load([[22300, 20160], [14400, 20160], [8800, 20160]]) },
      { name: 'Line 5 · Workwear', meta: 'L05 · 10 ops · 52%', bars: [bar(2, 7, 1, 'GO/2026/0032', 'ST-0144', '2,200', 'ok'), bar(12, 6, 1, 'GO/2026/0040', 'ST-0158', '1,600', 'ok')], load: load([[6100, 13440], [9600, 13440], [7200, 13440]]) }
    ];
    return { days, lines };
  }
}
</script>
</body>
</html>
